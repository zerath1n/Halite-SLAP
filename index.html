<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halit'e Şaplak</title>
<style>
:root{--panel:#fff6d6;--ink:#1d1a16;--red:#e63946;--ok:#2a9d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#3b2f5a;--ink:#fff3d1;--red:#ff5d6c;--ok:#5fd68a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#ffd23f}
#app{height:100%;display:flex;flex-direction:column}
#top{flex:0 0 48%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.7)}
#top::before{content:"";position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
#top.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-3px)}}
#hud{position:absolute;top:6px;left:0;right:0;padding:0 12px}
#money{font-size:28px;font-weight:800}
#rate{font-size:13px}
#lvl{font-size:14px;font-weight:800;margin-top:4px}
#bar{height:14px;border-radius:8px;background:rgba(0,0,0,.5);border:2px solid #fff;overflow:hidden;max-width:300px;margin:2px auto 0}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff3d3d,#ffb347);transition:width .1s}
#face{position:relative;width:min(14vh,28vw,110px);height:min(14vh,28vw,110px);z-index:2;border-radius:50%;background:#fff6d6;border:5px solid #1d1a16;display:flex;align-items:center;justify-content:center;font-size:min(7.5vh,15vw,60px);overflow:hidden;text-shadow:none}
#face.boss{border-color:#e63946;box-shadow:0 0 28px #e63946}
#face img{width:100%;height:100%;object-fit:cover}
#tint{position:absolute;inset:0;background:#e63946;opacity:0;pointer-events:none}
#face.hit{animation:hit .3s}
@keyframes hit{0%{transform:none}25%{transform:translateX(-28px) rotate(-16deg)}55%{transform:translateX(22px) rotate(10deg)}100%{transform:none}}
#halit{position:relative;margin-top:56px;display:flex;flex-direction:column;align-items:center}
#halit.ko{animation:ko .8s}
@keyframes ko{0%{transform:none}35%{transform:rotate(85deg) translate(20px,30px)}70%{transform:rotate(85deg) translate(20px,30px)}100%{transform:none}}
#bod{width:min(12vh,24vw,96px);margin-top:-8px;transform-origin:50% 10%;overflow:visible}
#bod.hit{animation:sway .3s}
@keyframes sway{25%{transform:rotate(9deg)}55%{transform:rotate(-6deg)}100%{transform:none}}
.al,.ar{transform-origin:32px 22px}
.ar{transform-origin:88px 22px}
#bod.hit .al{animation:fl .3s}
#bod.hit .ar{animation:fr .3s}
@keyframes fl{35%{transform:rotate(-55deg)}100%{transform:none}}
@keyframes fr{35%{transform:rotate(55deg)}100%{transform:none}}
#hand{position:absolute;top:0;left:50%;margin-left:-40px;font-size:80px;pointer-events:none;opacity:0;text-shadow:none;z-index:3}
#hand.go{animation:slap .28s}
@keyframes slap{0%{opacity:1;transform:translateX(130px) rotate(40deg)}60%{opacity:1;transform:translateX(20px) rotate(-10deg)}100%{opacity:0;transform:translateX(5px)}}
.pop{position:absolute;font-weight:900;font-size:22px;color:#ffe14a;pointer-events:none;animation:up .8s forwards;white-space:nowrap}
.pop.crit{font-size:32px;color:#ff4d6d}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
#combo{position:absolute;right:12px;top:70px;font-size:20px;font-weight:900;color:#ffe14a}
#say{position:absolute;bottom:5px;left:0;right:0;font-size:15px;font-weight:700;padding:0 8px}
#shop{flex:1;min-height:0;background:var(--panel);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:10px 12px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;font:inherit;font-size:12px;font-weight:800;padding:8px 2px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--panel)}
#list{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.item{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;padding:7px 10px;text-align:left;background:transparent;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.item .ic{font-size:28px;width:38px;text-align:center}
.item .tx{flex:1;font-weight:700;line-height:1.25}
.item small{display:block;font-weight:400;opacity:.85}
.item .st{font-weight:800;white-space:nowrap}
.item.locked{opacity:.5}
.item.equipped{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.item.equipped .st{color:var(--ok)}
.extra{display:flex;gap:8px;justify-content:center;padding:6px 0 10px}
.extra label,.extra button{font:inherit;font-size:13px;font-weight:700;background:var(--ink);color:var(--panel);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
input[type=file]{display:none}
#fc{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
#face.boss img{filter:saturate(1.6) contrast(1.1)}
#blush{position:absolute;top:30%;width:60%;height:55%;border-radius:50%;background:radial-gradient(circle,rgba(255,30,30,.9),rgba(255,30,30,0) 70%);opacity:0;pointer-events:none}
#blush.go{animation:bl .7s}
@keyframes bl{0%{opacity:1}100%{opacity:0}}
#bnd{position:absolute;right:8%;top:50%;font-size:min(5vh,10vw,38px);opacity:0;text-shadow:none}
#stars{position:absolute;top:-24px;left:50%;margin-left:-17px;font-size:34px;opacity:0;pointer-events:none;z-index:3;text-shadow:none;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(15deg)}}
#toast{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#ffe14a;padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:5;text-shadow:none}
#clones{position:absolute;top:104px;bottom:26px;left:6px;right:6px;display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;z-index:3;pointer-events:none;text-shadow:none}
.clone{position:relative}
#clones.n3 .clone{width:min(26vw,108px)}
#clones.n5 .clone{width:min(24vw,96px)}
#clones.n7 .clone{width:min(19vw,80px)}
.cf{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #e63946;background:#fff6d6;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 14px rgba(230,57,70,.7)}
.cf img{width:100%;height:100%;object-fit:cover}
.cb{height:8px;background:rgba(0,0,0,.55);border:1.5px solid #fff;border-radius:5px;overflow:hidden;margin-top:3px}
.cb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d3d,#ffb347)}
.clone.hit{animation:chit .28s}
@keyframes chit{25%{transform:translateX(-10px) rotate(-12deg)}55%{transform:translateX(8px) rotate(8deg)}}
.clone.dead{animation:cdead .45s forwards}
@keyframes cdead{to{transform:translateY(30px) rotate(80deg) scale(.3);opacity:0}}
.chand{position:absolute;font-size:56px;pointer-events:none;z-index:7;text-shadow:none;animation:cslap .3s forwards}
@keyframes cslap{0%{opacity:1;transform:translateX(70px) rotate(40deg)}60%{opacity:1;transform:translateX(0) rotate(-10deg)}100%{opacity:0;transform:translateX(-5px)}}
#halit.dev{transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){#face.hit,#hand.go,#top.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top" role="button" aria-label="Şaplak at">
    <div id="hud"><div id="money">0 ₺</div><div id="rate"></div><div id="lvl"></div><div id="bar"><div id="hp"></div></div></div>
    <div id="combo"></div><div id="toast"></div><div id="clones"></div>
    <div id="halit"><div id="face"><span id="fc">😐</span><div id="blush"></div><span id="bnd">🩹</span><div id="tint"></div></div><span id="stars">💫</span><svg id="bod" viewBox="0 0 120 140" aria-hidden="true"><rect x="38" y="80" width="17" height="42" rx="7" fill="#2b3a67"/><rect x="65" y="80" width="17" height="42" rx="7" fill="#2b3a67"/><ellipse cx="43" cy="127" rx="15" ry="7" fill="#1d1a16"/><ellipse cx="77" cy="127" rx="15" ry="7" fill="#1d1a16"/><g class="al"><rect x="12" y="14" width="18" height="56" rx="9" fill="#f4c28a"/></g><g class="ar"><rect x="90" y="14" width="18" height="56" rx="9" fill="#f4c28a"/></g><rect id="shirt" x="28" y="6" width="64" height="82" rx="20" fill="#3d8bff"/><text x="60" y="60" text-anchor="middle" font-size="32" font-weight="900" fill="#fff" font-family="Trebuchet MS,sans-serif">H</text></svg><div id="hand">🖐️</div></div>
    
    <div id="say">Halit'e dokun, para kazan!</div>
  </div>
  <div id="shop">
    <div class="tabs"><button id="t1" class="on">Araç</button><button id="t3">Sahne</button><button id="t4">Güç</button><button id="t5">🏆</button></div>
    <div id="list"></div>
    <div class="extra">
      
      <button id="rename">✏️ İsim</button>
      <button id="reset">Sıfırla</button>
    </div>
  </div>
</div>

function moveHalit(){var h=$("halit"),w=$("top").clientWidth;h.style.left=Math.round((Math.random()-.5)*(w-150))+"px";h.style.top=Math.round((Math.random()-.5)*30)+"px"}
function ratio(){if(C){var h=0,m=0;C.forEach(function(c){h+=c.hp;m+=c.max});return h/m}return S.hp/maxHp()}
function clearFight(){C=null;$("halit").style.left="0";$("halit").style.top="0";var b=$("clones");b.style.display="none";b.innerHTML="";$("halit").style.visibility="visible"}
function split(){
  var n=nClones(),base=10+5*S.lvl,hp=Math.round(base*(n===3?.7:n===5?.55:.45)),box=$("clones");
  box.innerHTML="";box.className="n"+n;box.style.display="flex";$("halit").style.visibility="hidden";C=[];
  for(var i=0;i<n;i++){var el=document.createElement("div");el.className="clone";el.innerHTML='<div class="cf">'+(S.photo?'<img src="'+S.photo+'" alt="">':"😐")+'</div><div class="cb"><i></i></div>';box.appendChild(el);C.push({hp:hp,max:hp,el:el})}
  $("say").textContent="Halit "+n+"'e bölündü! 😱";toast("🧬 Halit "+n+" parçaya bölündü!");
  [300,500,700,900,1100,1300,1500].slice(0,n).forEach(function(f,i){setTimeout(function(){beep(f,"square",.2)},i*80)});
}
function hitClone(c,d){
  c.hp=Math.max(0,c.hp-d);c.el.querySelector("i").style.width=(c.hp/c.max*100)+"%";
  if(c.hp<=0&&!c.dead){c.dead=1;c.el.classList.add("dead");beep(300,"triangle",.3);
    if(C.every(function(x){return x.dead})&&!C.done){C.done=1;setTimeout(ko,450)}}
}
function cloneFx(c){
  var el=c.el;el.classList.remove("hit");void el.offsetWidth;el.classList.add("hit");
  var h=document.createElement("div"),q=el.getBoundingClientRect(),r=$("top").getBoundingClientRect();
  h.className="chand";h.textContent=tool().ic;h.style.left=(q.left-r.left+q.width/2-28)+"px";h.style.top=(q.top-r.top+q.height/2-36)+"px";
  $("top").appendChild(h);setTimeout(function(){h.remove()},320);
}
function item(id,ic,n,sub,st,on,c){return '<button class="item'+(on?" equipped":"")+'" data-id="'+id+'" data-c="'+c+'"><span class="ic">'+ic+'</span><span class="tx">'+n+'<small>'+sub+'</small></span><span class="st">'+st+'</span></button>'}
function render(){
  var bg=BGS.filter(function(b){return b.id===S.bg})[0]||BGS[0],html="",sc=$("list").scrollTop;
  $("top").style.background=bg.css;$("top").style.backgroundSize="cover";$("top").style.backgroundPosition="center bottom";
  $("hand").textContent=tool().ic;document.title=S.name+"'e Şaplak";
  if(tab===1)TOOLS.forEach(function(it,i){var ow=S.owned[it.id],on=S.tool===it.id,pv=i>0?TOOLS[i-1]:null,lk=!ow&&pv&&!S.owned[pv.id];
    html+=item(it.id,lk?"🔒":it.ic,it.n,lk?"Önce "+pv.n+" al":"+"+sh(it.p)+" ₺ / vuruş",on?"Takılı ✓":ow?"Kullan":lk?"Kilitli":sh(it.c)+" ₺",on,ow?0:lk?1e15:it.c)});
  else if(tab===2)HELP.forEach(function(it){var c=hcost(it);html+=item(it.id,it.ic,it.n,"+"+fmt(it.r*gainMul())+" ₺/sn · Sahip: "+(S.help[it.id]||0),fmt(c)+" ₺",false,c)});
  else if(tab===3)BGS.forEach(function(it){var ow=S.owned[it.id],on=S.bg===it.id;html+=item(it.id,it.ic,it.n,"Arka plan",on?"Takılı ✓":ow?"Kullan":fmt(it.c)+" ₺",on,ow?0:it.c)});
  else if(tab===4)UPS.forEach(function(u){var l=upl(u),mx=l>=u.max;html+=item(u.id,u.ic,u.n,u.d+" · Sv "+l+"/"+u.max,mx?"MAX ✓":fmt(upcost(u))+" ₺",mx,mx?0:upcost(u))});
  else if(tab===5)ACH.forEach(function(a){var d=S.ach[a.id];html+=item(a.id,"🏆",a.n,a.d,d?"✓":"+"+fmt(a.r)+" ₺",d,d?0:1e12)});
  $("list").innerHTML=html;$("list").scrollTop=sc;aff();hud();
}
function aff(){[].forEach.call($("list").children,function(b){b.classList.toggle("locked",S.money<+b.getAttribute("data-c"))})}
$("list").addEventListener("click",function(e){
  var b=e.target.closest(".item");if(!b||tab===5)return;
  var id=b.getAttribute("data-id"),no=function(){$("say").textContent="Yetmiyor! Halit'e biraz daha vur 😈"};
  if(tab===2){var h=HELP.filter(function(x){return x.id===id})[0],c=hcost(h);
    if(S.money<c)return no();S.money-=c;S.help[id]=(S.help[id]||0)+1;$("say").textContent=h.n+" işe başladı!"}
  else if(tab===4){var u=UPS.filter(function(x){return x.id===id})[0];if(upl(u)>=u.max)return;var c2=upcost(u);
    if(S.money<c2)return no();S.money-=c2;S.up[id]=upl(u)+1;$("say").textContent=u.n+" yükseldi!"}
  else{var arr=tab===1?TOOLS:BGS,it=arr.filter(function(x){return x.id===id})[0];
    if(!S.owned[id]){if(tab===1){var ix=TOOLS.indexOf(it);if(ix>0&&!S.owned[TOOLS[ix-1].id]){$("say").textContent="Önce "+TOOLS[ix-1].n+" almalısın!";return}}if(S.money<it.c)return no();S.money-=it.c;S.owned[id]=1;$("say").textContent=it.n+" alındı!"}
    if(tab===1)S.tool=id;else S.bg=id}
  save();render();
});
$("top").addEventListener("pointerdown",function(e){
  if(boss()&&bossType()==="kacak"&&!C){var hq=$("halit").getBoundingClientRect();if(e.clientX<hq.left-16||e.clientX>hq.right+16||e.clientY<hq.top-16||e.clientY>hq.bottom+16){$("say").textContent="Iska! Halit kaçtı, tam üstüne dokun 🙈";combo=0;return}}
  var now=Date.now();combo=(now-last<comboWin())?combo+1:1;last=now;if(combo>S.maxCombo)S.maxCombo=combo;
  var crit=Math.random()<critChance(),gain=Math.round(tool().p*mult()*(crit?5:1)*gainMul());
  S.money+=gain;S.slaps++;if(crit)S.crits++;
  $("say").textContent=crit?"KRİTİK ŞAPLAK! 💥":lines[Math.floor(Math.random()*lines.length)];
  sfx(S.tool,crit);
  if(navigator.vibrate){try{navigator.vibrate(crit?80:30)}catch(x){}}
  var f=$("face"),h=$("hand"),t=$("top"),bl=$("blush"),bd=$("bod");
  f.classList.remove("hit");bd.classList.remove("hit");h.classList.remove("go");t.classList.remove("shake");bl.classList.remove("go");
  bl.style.left=Math.random()<.5?"-8%":"48%";void f.offsetWidth;
  f.classList.add("hit");bd.classList.add("hit");h.classList.add("go");bl.classList.add("go");if(crit)t.classList.add("shake");
  var r=t.getBoundingClientRect();pop((crit?"KRİTİK ":"")+"+"+fmt(gain)+" ₺",e.clientX-r.left-30,e.clientY-r.top-20,crit);
  var dd=dmgBase()*(crit?3:1),tc=null;
  if(C){var best=1e12;C.forEach(function(c){if(c.dead)return;var q=c.el.getBoundingClientRect(),d2=Math.pow(e.clientX-(q.left+q.width/2),2)+Math.pow(e.clientY-(q.top+q.height/2),2);if(d2<best){best=d2;tc=c}});if(tc)cloneFx(tc)}
  dmg(dd,tc);if(boss()&&bossType()==="kacak"&&!C)moveHalit();hud();
});
setInterval(function(){
  var inc=income(),n=Date.now();
  if(inc>0){S.money+=inc/10;acc+=inc/100;if(acc>=1){var d=Math.floor(acc);acc-=d;dmg(d)}}
  if(combo&&n-last>comboWin())combo=0;
  hud();if(n-lastAff>300){lastAff=n;aff();chk()}
},100);
setInterval(save,3000);
[1,3,4,5].forEach(function(i){$("t"+i).onclick=function(){tab=i;[1,3,4,5].forEach(function(j){$("t"+j).className=j===i?"on":""});render()}});

$("rename").onclick=function(){var v=prompt("Kimin şaplak yiyeceğini yaz:",S.name);if(v){S.name=v.trim()||S.name;save();render()}};
var armed=false;$("reset").onclick=function(){var b=$("reset");if(!armed){armed=true;b.textContent="Emin misin? Tekrar bas";setTimeout(function(){armed=false;b.textContent="Sıfırla"},3000);return}armed=false;b.textContent="Sıfırla";var nm=S.name;clearFight();S=fresh();S.name=nm;S.hp=maxHp();combo=0;acc=0;save();render();$("say").textContent="Her şey sıfırlandı, baştan başla!"};
renderPhoto();render();
</script>
</body>
</html>
